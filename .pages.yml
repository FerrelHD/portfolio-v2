media:
  - name: projects
    label: Project Screenshots
    input: public/projects
    output: /projects
    categories: [image]
    rename: safe
  - name: videos
    label: Project Videos
    input: public/videos
    output: /videos
    categories: [video]
    extensions: [mp4, webm, mov]
    rename: safe

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, year, categoryFilter, featured, order]
      primary: title
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: id
        label: URL Slug (Optional)
        type: string
        description: "Leave empty to auto-derive from filename (e.g. my-project)."
      - name: year
        label: Year
        type: string
        required: true
        default: "2026"
        pattern:
          regex: "^\\d{4}$"
          message: "Use a 4-digit year (e.g. 2026)."
      - name: order
        label: Display Order
        type: number
        default: 1
        description: "Lower numbers appear first in Archive and Case Studies."
      - name: category
        label: Category Subtitle
        type: string
        required: true
        description: "Short editorial label (e.g. 'Native macOS Bezel Companion')."
      - name: categoryFilter
        label: Archive Filter
        type: select
        required: true
        options:
          values:
            - value: web
              label: Web & Apps
            - value: creative
              label: Creative Motion
            - value: ml
              label: Machine Learning
            - value: games
              label: 3D & Games
      - name: description
        label: Short Description
        type: text
        required: true
        description: "Shown in Archive list, SEO image sitemap, and Case Study fallback."
      - name: techStack
        label: Tech Stack
        type: string
        list: true
        required: true
      - name: previewImg
        label: Preview Screenshot
        type: image
        required: true
        options:
          media: projects
      - name: liveUrl
        label: Live Demo URL
        type: string
      - name: githubUrl
        label: GitHub Repository URL
        type: string
      - name: domain
        label: Browser Frame Domain (Optional)
        type: string
        description: "Auto-inferred from Live or GitHub URL if left empty."
      - name: aliases
        label: Legacy Slug Aliases (Optional)
        type: string
        list: true
      - name: featured
        label: Featured in Works (Chapter II)
        type: boolean
        default: false
        description: "Enable to display as a fullscreen showcase slide in Chapter II."
      - name: featuredOrder
        label: Featured Slide Order
        type: number
        description: "Order inside Chapter II when Featured is enabled (1 = first slide)."
      - name: featuredSlide
        label: Featured Slide Copy & Video (Optional)
        type: object
        list: false
        fields:
          - name: title
            label: Short Slide Title Override
            type: string
          - name: aboutP1
            label: Slide Paragraph 1 (Problem / Concept)
            type: text
          - name: aboutP2
            label: Slide Paragraph 2 (Engineering Solution)
            type: text
          - name: previewVideo
            label: Demo Loop Video
            type: file
            options:
              media: videos
              extensions: [mp4, webm]
          - name: mediaClass
            label: Custom Tailwind Media Classes
            type: string
      - name: caseStudy
        label: Case Study Details (Optional)
        type: object
        list: false
        fields:
          - name: tagline
            label: Case Study Tagline
            type: text
          - name: role
            label: Role
            type: string
          - name: system
            label: System Summary
            type: string
          - name: context
            label: Project Context
            type: string
          - name: techStack
            label: Extended Tech Stack (Optional)
            type: string
            list: true
          - name: metrics
            label: Key Metrics
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - name: label
                label: Label
                type: string
              - name: value
                label: Value
                type: string
          - name: problem
            label: 01. Problem & Context
            type: object
            fields:
              - name: headline
                label: Headline
                type: string
              - name: description
                label: Description
                type: text
          - name: architecture
            label: 02. System Architecture
            type: object
            fields:
              - name: headline
                label: Headline
                type: string
              - name: description
                label: Description
                type: text
              - name: highlights
                label: Engineering Highlights
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Highlight Title
                    type: string
                  - name: detail
                    label: Technical Detail
                    type: text
          - name: features
            label: 03. Key Features
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} ({tag})"
            fields:
              - name: title
                label: Feature Title
                type: string
              - name: description
                label: Description
                type: text
              - name: tag
                label: Tag
                type: string
          - name: takeaways
            label: 04. Key Takeaways
            type: string
            list: true
